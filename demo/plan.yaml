# G3 demo: three workers on django.utils.text, where a's signature change has to reach b and stop c.
# Run from the loom repo:  PYTHONPATH=.:.. PATH=$PWD/bench/.venv/bin:$PATH loom run --plan demo/plan.yaml --model sonnet
repo: ~/Documents/loom-demo
test: "cd tests && PYTHONPATH=.. ~/Documents/loom/bench/.venv/bin/python runtests.py utils_tests.test_text template_tests.filter_tests.test_slugify utils_tests.test_text_a utils_tests.test_text_b utils_tests.test_text_c --parallel 1"
tasks:
  - id: a
    title: strict slugify
    prompt: >
      Add a required keyword-only parameter `strict` to django.utils.text.slugify. When strict is True, raise
      ValueError if the result is empty; when False, keep today's behaviour. Pass strict=False at every existing
      caller in django/ and in the existing tests under tests/. Put your new tests in a new file
      tests/utils_tests/test_text_a.py (class StrictSlugifyTests). Run tests from the repo root with
      `python tests/runtests.py utils_tests.test_text utils_tests.test_text_a --parallel 1`.
    scope: [django/utils/text.py::slugify]
  - id: b
    title: title_slug helper
    prompt: >
      Add a function title_slug(title) to django/utils/text.py, placed directly after slugify, that lowercases the
      title, strips a leading "the ", and returns django.utils.text.slugify of the rest. Put its tests in a new file
      tests/utils_tests/test_text_b.py (class TitleSlugTests). Run tests from the repo root with
      `python tests/runtests.py utils_tests.test_text_b --parallel 1`.
  - id: c
    title: slugify max_length
    prompt: >
      Two things: (1) give django.utils.text.slugify a new optional parameter max_length=None that truncates the
      result; (2) add a function capfirst_words(s) at the end of django/utils/text.py that applies capfirst to
      each word. Put tests for what you change in a new file tests/utils_tests/test_text_c.py (class
      CapfirstWordsTests). If Loom denies your slugify change, slugify belongs to another agent: skip (1), do not
      edit slugify later, and finish (2). Run tests from the repo root with
      `python tests/runtests.py utils_tests.test_text_c --parallel 1`.
